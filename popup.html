<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 220px; padding: 12px; font-family: sans-serif; }
    .input-group { display: flex; gap: 6px; margin-bottom: 10px; }
    select { padding: 8px; border: 1px solid #dfe1e6; border-radius: 3px; background: #f4f5f7; cursor: pointer; outline: none; }
    select:hover { background: #ebecf0; }
    input { flex: 1; min-width: 0; padding: 8px; box-sizing: border-box; border: 1px solid #dfe1e6; border-radius: 3px; outline: none; }
    input:focus { border-color: #4c9aff; }
    button { width: 100%; padding: 8px; cursor: pointer; background: #0052cc; color: white; border: none; border-radius: 3px; font-weight: bold; }
    button:hover { background: #0047b3; }

    #historyContainer { display: flex; flex-direction: column; gap: 5px; }
    .history-item { 
        font-size: 12px; 
        color: #0052cc; 
        cursor: pointer; 
        text-decoration: underline;
        background: #f4f5f7;
        padding: 4px;
        border-radius: 3px;
    }
    .history-item:hover { background: #ebecf0; }
    hr { border: 0; border-top: 1px solid #ddd; margin: 15px 0; }
  </style>
</head>
<body>
  <div class="input-group">
    <select id="prefixSelect">
      <option value="PGNG">PGNG</option>
      <option value="UX">UX</option>
      <option value="CQTB">CQTB</option>
      <option value="CPTR">CPTR</option>
      <option value="PRODV2">PRODV2</option>
      <option value="CRPW">CRPW</option>
    </select>
    <input type="text" id="ticketNum" placeholder="e.g. 36123" autofocus>
  </div>
  <button id="goBtn">Open Ticket</button>
  <hr>
    <div id="historyLabel" style="font-size: 10px; color: #666; margin-bottom: 5px;">RECENT:</div>
    <div id="historyContainer"></div>
  <script src="popup.js"></script>
</body>
</html>
